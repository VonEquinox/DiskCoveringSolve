name: Certificate audit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  certificate-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y g++ libboost-dev
      - run: make integrity
      - run: make cover11-quick PYTHON_BIN="$(command -v python)"
      - run: make cover12-full PYTHON_BIN="$(command -v python)"
      - run: make cover13-full PYTHON_BIN="$(command -v python)"
