name: Certificate audit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  certificate-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y g++ libboost-dev
      - run: make integrity
      - run: make cover11-quick PYTHON_BIN="$(command -v python)"
      - run: make cover12-full PYTHON_BIN="$(command -v python)"
      - run: make cover13-full PYTHON_BIN="$(command -v python)"
      - run: make cover14-full PYTHON_BIN="$(command -v python)"
      - run: make cover14-alternative-full PYTHON_BIN="$(command -v python)"

  cover15-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [primary, alternative]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y g++ libboost-dev
      - run: make cover15-integrity
      - run: make cover15-${{ matrix.variant }}-full PYTHON_BIN="$(command -v python)"

  cover16-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y g++ libboost-dev
      - run: make cover16-integrity cover16-runner-tests
      - run: make cover16-full PYTHON_BIN="$(command -v python)"

  cover17-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y g++ clang
      - run: make cover17-integrity cover17-runner-tests
      - run: make cover17-full PYTHON_BIN="$(command -v python)"
      - run: python -S -B cover17/test_peeling_counts.py --sanitize

  cover18-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [primary, alternative]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y g++
      - run: make cover18-integrity cover18-runner-tests
      - run: make cover18-${{ matrix.variant }}-full PYTHON_BIN="$(command -v python)"

  cover19-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [primary, alternative]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y g++
      - run: make cover19-integrity cover19-runner-tests
      - run: make cover19-${{ matrix.variant }}-full PYTHON_BIN="$(command -v python)"
